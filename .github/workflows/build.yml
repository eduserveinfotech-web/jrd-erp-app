name: Build JRD Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest build-tools;34.0.0 platforms;android-34'
          accept-android-sdk-licenses: true

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap SDK Paths
        shell: bash
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Create TWA Manifest Config
        shell: bash
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.jrdschool.erp",
            "host": "jrdschool.online",
            "name": "JRD Public School",
            "shortName": "JRD ERP",
            "startUrl": "/app_login.html",
            "display": "standalone",
            "themeColor": "#070709",
            "navigationColor": "#070709",
            "backgroundColor": "#070709",
            "enableNotifications": true,
            "shortcuts": [],
            "iconUrl": "https://jrdschool.online/logo.png",
            "maskableIconUrl": "https://jrdschool.online/logo.png",
            "signingKey": {
              "path": "android.keystore",
              "alias": "jrd"
            },
            "minSdkVersion": 21,
            "targetSdkVersion": 34,
            "compileSdkVersion": 34,
            "enableSiteSettingsShortcut": true,
            "generatorApp": "bubblewrap-cli"
          }
          EOF

      - name: Generate Keystore & Build APK
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "123456"
          BUBBLEWRAP_KEY_PASSWORD: "123456"
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias jrd -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JRD School, O=JRD, C=IN"
          bubblewrap update --manifest twa-manifest.json
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JRD-School-Signed-APK
          path: app-release-signed.apk
