name: Build Pure Universal Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;33.0.2 platforms;android-33'
          accept-android-sdk-licenses: true

      - name: Create Clean Native WebView App with Full PiP & Fullscreen Support
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jrdschool/erp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          curl -sL "https://jrdschool.online/logo.png" -o app/src/main/res/drawable/icon.png || true

          cat << 'EOF' > settings.gradle
          rootProject.name = "JRDPublicSchool"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.jrdschool.erp'
              compileSdk 33
              defaultConfig {
                  applicationId "com.jrdschool.erp"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="JRD Public School"
                  android:icon="@drawable/icon"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/jrdschool/erp/MainActivity.java
          package com.jrdschool.erp;

          import android.app.Activity;
          import android.app.PictureInPictureParams;
          import android.content.res.Configuration;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Rational;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout customViewContainer;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private View customView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout decorView = new FrameLayout(this);
                  decorView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  customViewContainer = new FrameLayout(this);
                  customViewContainer.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  decorView.addView(webView);
                  decorView.addView(customViewContainer);
                  setContentView(decorView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  // 🌐 फुलस्क्रीन वीडियो सपोर्ट के लिए WebChromeClient
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewContainer.addView(customView);
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          customViewContainer.setVisibility(View.VISIBLE);

                          getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                  WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          customViewContainer.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          customViewContainer.removeView(customView);
                          customView = null;
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                          }

                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  });

                  // 🌐 JavaScript से Android Native PiP ट्रिगर करने का ब्रिज
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void enterPiP() {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              runOnUiThread(() -> {
                                  try {
                                      Rational aspectRatio = new Rational(16, 9);
                                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                                              .setAspectRatio(aspectRatio)
                                              .build();
                                      enterPictureInPictureMode(params);
                                  } catch (Exception e) {}
                              });
                          }
                      }
                  }, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://jrdschool.online/app_login.html");
              }

              // जब छात्र होम बटन दबाएगा, तो वीडियो ऑटोमैटिक PiP में आ जाएगा
              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      webView.evaluateJavascript("if(window.activePipMeta && window.activePipMeta.isPlaying){ 'PLAYING'; } else { 'IDLE'; }", value -> {
                          if (value != null && value.contains("PLAYING")) {
                              try {
                                  Rational aspectRatio = new Rational(16, 9);
                                  PictureInPictureParams params = new PictureInPictureParams.Builder()
                                      .setAspectRatio(aspectRatio)
                                      .build();
                                  enterPictureInPictureMode(params);
                              } catch (Exception e) {}
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      WebChromeClient client = webView.getWebChromeClient();
                      if (client != null) {
                          client.onHideCustomView();
                      }
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build & Sign Universal APK with Gradle 8.2
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleRelease
          keytool -genkeypair -v -keystore jrd.keystore -alias jrd -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JRD School, O=JRD, C=IN"
          $ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner sign --ks jrd.keystore --ks-key-alias jrd --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --out JRD-School-Universal.apk app-aligned.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: JRD-School-Universal-APK
          path: JRD-School-Universal.apk
